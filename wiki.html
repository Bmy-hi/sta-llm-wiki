<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STA LLM Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
body { margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; background:#f6f7f9; color:#1d232b; line-height:1.75; }
header { background:#0f1b2d; color:#fff; padding:.9rem 1.5rem; border-bottom:4px solid #f2a541; }
header a { color:#fff; text-decoration:none; font-weight:700; margin-right:1.2rem; }
main { max-width:900px; margin:0 auto; padding:1.5rem; background:#fff; min-height:80vh; }
h1, h2 { color:#0f1b2d; } h2 { border-left:5px solid #f2a541; padding-left:.6rem; }
pre { background:#1e2430; color:#e6e9ef; padding:1rem; border-radius:8px; overflow-x:auto; }
code { font-family:"JetBrains Mono",Consolas,monospace; }
blockquote { margin:0; padding:.4rem 1rem; background:#eef4fb; border-left:5px solid #0f1b2d; color:#44505e; }
table { border-collapse:collapse; width:100%; } th, td { border:1px solid #d7dde5; padding:.4rem .7rem; text-align:left; } th { background:#e8ecf2; }
.path { color:#8a96a3; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <a href="./">🏠 首頁</a><a href="wiki.html?p=wiki/index.md">📚 Wiki 目錄</a><a href="slides/">🎞 簡報</a><a href="wiki.html?p=docs/workflow.md">🔁 Loop / Graph</a>
</header>
<main><div class="path" id="path"></div><div id="content">載入中…</div></main>
<script>
(function () {
    var params = new URLSearchParams(location.search);
    var p = params.get('p') || 'wiki/index.md';
    if (!/^[\w\-\/.]+\.md$/.test(p) || p.indexOf('..') === 0) p = 'wiki/index.md';
    document.getElementById('path').textContent = p;
    var dir = p.split('/').slice(0, -1);

    function resolve(href) {
        var parts = dir.slice();
        href.split('/').forEach(function (s) {
            if (s === '..') parts.pop(); else if (s !== '.') parts.push(s);
        });
        return parts.join('/');
    }

    fetch(p).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
    }).then(function (md) {
        var el = document.getElementById('content');
        el.innerHTML = marked.parse(md);
        el.querySelectorAll('a[href]').forEach(function (a) {
            var h = a.getAttribute('href');
            if (/^https?:/.test(h)) { a.target = '_blank'; return; }
            if (/\.md$/.test(h)) a.href = 'wiki.html?p=' + resolve(h);
        });
        var blocks = el.querySelectorAll('code.language-mermaid');
        blocks.forEach(function (code) {
            var d = document.createElement('div');
            d.className = 'mermaid';
            d.textContent = code.textContent;
            code.parentNode.replaceWith(d);
        });
        if (blocks.length) { mermaid.initialize({ startOnLoad: false }); mermaid.run(); }
        var h1 = el.querySelector('h1');
        if (h1) document.title = h1.textContent + ' | STA LLM Wiki';
    }).catch(function (e) {
        document.getElementById('content').textContent = '找不到頁面：' + p + '（' + e.message + '）';
    });
})();
</script>
</body>
</html>
